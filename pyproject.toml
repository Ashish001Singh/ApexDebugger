[project]
name = "apex-copilot"
version = "0.1.0"
description = "AI-powered Salesforce Apex code reviewer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "click>=8.1.7",
    "anthropic>=0.28.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "langgraph>=1.2.9",
    "openai>=2.38.0",
]

[project.optional-dependencies]
local = [
    "chromadb>=0.5.0",
    "crawl4ai>=0.3.0",
    "tiktoken>=0.7.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.0",
]

[project.scripts]
copilot = "cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_copilot", "src/review_core", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: tests that call the real LLM (need OPENAI_API_KEY, cost money)"]

[tool.ruff]
line-length = 100
